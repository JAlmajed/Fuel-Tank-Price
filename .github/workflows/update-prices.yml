name: Update fuel prices

on:
  schedule:
    # Bahrain announces prices around the 1st-2nd. Try on the 2nd to 5th at 07:00 Bahrain time.
    - cron: "0 4 2,3,4,5 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch new prices
        run: python scripts/update_prices.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain prices.json)" ]; then
            git config user.name "fuel-price-bot"
            git config user.email "actions@users.noreply.github.com"
            git add prices.json
            git commit -m "Update fuel prices"
            git push
          fi
