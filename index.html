<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Fuel Cost">

    <title>Bahrain Fuel Cost</title>

    <link rel="icon" href="icon-v2.ico?v=2" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="icon-v2-32.png?v=2">
    <link rel="apple-touch-icon" sizes="180x180" href="icon-v2-180.png?v=2">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#071f33">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <h1>Bahrain Fuel Cost</h1>

    <div class="settings">
        <select id="fuel" aria-label="Fuel type"></select>

        <div class="seg" role="group" aria-label="Calculation method">
            <button id="modeKm" type="button" aria-pressed="false">By distance</button>
            <button id="modeFill" type="button" aria-pressed="true">By fill-ups</button>
        </div>
    </div>

    <div class="inputs" id="kmInputs" hidden>

        <div class="card">
            <label class="card-label" for="km">Distance per month (km)</label>
            <input id="km" class="big-input" type="number" inputmode="decimal" min="0" step="10">
            <div class="stepper">
                <button type="button" data-target="km" data-step="-100" aria-label="Less distance">&minus; 100</button>
                <button type="button" data-target="km" data-step="100" aria-label="More distance">+ 100</button>
            </div>
        </div>

        <div class="card">
            <label class="card-label" for="cons">Consumption (L per 100 km)</label>
            <input id="cons" class="big-input" type="number" inputmode="decimal" min="0" step="0.1">
            <div class="stepper">
                <button type="button" data-target="cons" data-step="-0.5" aria-label="Lower consumption">&minus; 0.5</button>
                <button type="button" data-target="cons" data-step="0.5" aria-label="Higher consumption">+ 0.5</button>
            </div>
        </div>

    </div>

    <div class="inputs" id="fillInputs">

        <div class="card">
            <label class="card-label" for="tank">Litres per fill-up</label>
            <input id="tank" class="big-input" type="number" inputmode="decimal" min="0" step="1">
            <div class="stepper">
                <button type="button" data-target="tank" data-step="-5" aria-label="Fewer litres">&minus; 5</button>
                <button type="button" data-target="tank" data-step="5" aria-label="More litres">+ 5</button>
            </div>
        </div>

        <div class="card">
            <label class="card-label" for="fills">Fill-ups per month</label>
            <input id="fills" class="big-input" type="number" inputmode="decimal" min="0" step="0.5">
            <div class="stepper">
                <button type="button" data-target="fills" data-step="-1" aria-label="Fewer fill-ups">&minus; 1</button>
                <button type="button" data-target="fills" data-step="1" aria-label="More fill-ups">+ 1</button>
            </div>
        </div>

    </div>

    <div class="result">
        <div class="result-label">Estimated per month</div>
        <div class="total"><span id="month">0.000</span> <small>BHD</small></div>
        <div id="fuelLine" class="fuel-line"></div>

        <div class="stats">
            <div><b id="litres">0</b><span>litres / month</span></div>
            <div><b id="perDay">0.000</b><span>BHD / day</span></div>
            <div><b id="perKm">0.000</b><span>BHD / km</span></div>
            <div><b id="year">0</b><span>BHD / year</span></div>
        </div>
    </div>

    <h2>Same use, other fuels</h2>
    <div class="compare" id="compare"></div>

    <h2>Pump prices (BHD per litre)</h2>
    <div class="prices" id="priceInputs"></div>

    <div class="controls">
        <button id="resetPrices" type="button">Reset prices</button>
        <button id="resetAll" type="button">Reset everything</button>
    </div>

    <p id="note" class="note"></p>

</div>

<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
    });
}
</script>

</body>
</html>
